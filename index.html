<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Void Walker Forest Run</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        /* HUD */
        #hud { display: none; justify-content: space-between; align-items: flex-start; width: 100%; font-size: 22px; font-weight: bold; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .hud-box { background: rgba(0, 0, 0, 0.6); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); margin-bottom: 5px; }
        
        #powerup-container { display: flex; flex-direction: column; gap: 5px; align-items: center; position: absolute; top: 70px; left: 50%; transform: translateX(-50%); }
        .power-hud { display: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); text-shadow: 1px 1px 2px rgba(0,0,0,0.5); color: #fff; }
        #hud-jump { background: rgba(40, 167, 69, 0.85); }
        #hud-coin { background: rgba(255, 193, 7, 0.85); }
        #hud-speed { background: rgba(23, 162, 184, 0.85); }

        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(15, 15, 35, 0.95), rgba(30, 20, 50, 0.98)); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; text-align: center; }
        h1 { font-size: 42px; margin: 0 0 10px 0; background: linear-gradient(45deg, #00ffff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 15px rgba(0,255,255,0.3); }
        .subtitle { font-size: 18px; color: #ccc; margin-bottom: 25px; }
        .btn { background: linear-gradient(45deg, #ff416c, #ff4b2b); border: none; color: white; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4); transition: transform 0.2s; margin: 8px; }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: linear-gradient(45deg, #2193b0, #6dd5ed); box-shadow: 0 6px 15px rgba(33, 147, 176, 0.4); }

        /* Shop Grid */
        #shop-menu { display: none; justify-content: flex-start; overflow-y: auto; padding: 30px 10px; box-sizing: border-box; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 800px; padding-bottom: 40px; margin-top: 10px;}
        .shop-card { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(5px); }
        .shop-card img { width: 80px; height: 80px; border-radius: 8px; margin-bottom: 10px; background: #333; image-rendering: pixelated; }
        .shop-card h3 { margin: 0 0 5px 0; font-size: 16px; text-align: center;}
        .shop-card button { padding: 6px 12px; font-size: 14px; width: 100%; margin-top: auto; }

        /* Mobile Controls */
        #mobile-controls { display: flex; position: absolute; bottom: 30px; width: 100%; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }
        .control-btn { pointer-events: auto; width: 65px; height: 65px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; backdrop-filter: blur(5px); transition: background 0.1s; }
        .control-btn:active { background: rgba(255, 255, 255, 0.4); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="hud">
            <div>
                <div class="hud-box">🏆 <span id="score-val">0</span>m</div>
                <div class="hud-box">🪙 <span id="coins-val">0</span></div>
            </div>
        </div>
        <div id="powerup-container">
            <div id="hud-jump" class="power-hud">⚡ Jump: <span id="val-jump">0</span>s</div>
            <div id="hud-coin" class="power-hud">🪙 2x Coin: <span id="val-coin">0</span>s</div>
            <div id="hud-speed" class="power-hud">💨 Speed: <span id="val-speed">0</span>s</div>
        </div>
        <div id="mobile-controls">
            <div style="display: flex; gap: 10px;">
                <div class="control-btn" id="btn-left">◀</div>
                <div class="control-btn" id="btn-right">▶</div>
            </div>
            <div class="control-btn" id="btn-jump">▲</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen">
        <h1>VOID WALKER RUN</h1>
        <div class="subtitle" id="menu-highscore">🏆 High Score: 0m</div>
        <div class="subtitle" id="menu-totalcoins" style="color: #ffd700; margin-top: -15px;">🪙 Coins: 0</div>
        <button class="btn interactive" onclick="startGame()">PLAY GAME</button>
        <button class="btn btn-secondary interactive" onclick="openShop()">CHARACTER SHOP</button>
    </div>

    <!-- Shop Menu -->
    <div id="shop-menu" class="menu-screen">
        <button class="btn btn-secondary interactive" style="padding: 8px 20px; font-size: 14px; margin-bottom: 10px;" onclick="closeShop()">← BACK TO HOME</button>
        <h2 style="margin: 0;">CHARACTER SHOP</h2>
        <div class="subtitle" style="margin-bottom: 10px;">Coins: <span id="shop-coins" style="color: #ffd700; font-weight:bold;">0</span></div>
        <div class="shop-grid" id="shop-grid-container"></div>
    </div>

    <!-- Game Over -->
    <div id="gameover-menu" class="menu-screen" style="display: none;">
        <h1 style="color: #ff416c;">GAME OVER</h1>
        <div id="techno-text" style="font-size: 20px; font-weight: bold; color: #ffd700; margin-bottom: 15px; display: none;">👑 Not even close baby, Technoblade never dies!</div>
        <div class="subtitle" id="final-score">Score: 0m</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn interactive" onclick="startGame()">TRY AGAIN</button>
            <button class="btn btn-secondary interactive" onclick="goHome()">HOME</button>
        </div>
    </div>

    <script>
        // Data
        const skinsData = [
            { id: 'default', name: 'Pig King', cost: 0, head: 0xf5bcc2, body: 0xdc143c, legs: 0x4f4f4f, arms: 0xf5bcc2, crown: true },
            { id: 'void', name: 'Void Walker', cost: 100, head: 0xdddddd, body: 0x111111, legs: 0x222222, arms: 0x111111, crown: false },
            { id: 'aizex', name: 'Aizex Gaming', cost: 100, head: 0xf5bcc2, body: 0xd4af37, legs: 0x333333, arms: 0xd4af37, crown: true },
            { id: 'dream', name: 'Dream', cost: 200, head: 0xffffff, body: 0x32cd32, legs: 0x32cd32, arms: 0x32cd32, crown: false },
            { id: 'total', name: 'Total Gaming', cost: 300, head: 0xffcc00, body: 0x000000, legs: 0x222222, arms: 0xffcc00, crown: false },
            { id: 'techno', name: 'Techno Gamerz', cost: 300, head: 0xffd700, body: 0xff0000, legs: 0x111111, arms: 0xff0000, crown: false },
            { id: 'beast', name: 'MrBeast', cost: 500, head: 0x00ffff, body: 0xff00ff, legs: 0x111111, arms: 0x00ffff, crown: false },
            { id: 'carry', name: 'CarryMinati', cost: 300, head: 0xffe4c4, body: 0x111111, legs: 0x333333, arms: 0x111111, crown: false },
            { id: 'pewdiepie', name: 'PewDiePie', cost: 400, head: 0xffe4c4, body: 0xff0000, legs: 0x000000, arms: 0xff0000, crown: false },
            { id: 'mortal', name: 'Mortal', cost: 300, head: 0xffe4c4, body: 0xd4af37, legs: 0x111111, arms: 0xd4af37, crown: false },
            { id: 'gamerfleet', name: 'GamerFleet', cost: 200, head: 0xffe4c4, body: 0x006400, legs: 0x111111, arms: 0x006400, crown: false }
        ];

        let totalCoins = parseInt(localStorage.getItem('vw_total_coins') || '500'); // starting bonus
        let equippedSkin = localStorage.getItem('vw_equipped_skin') || 'default';
        let unlockedSkins = JSON.parse(localStorage.getItem('vw_unlocked_skins') || '["default"]');
        let highScore = parseInt(localStorage.getItem('vw_highscore') || '0');

        let scene, camera, renderer, playerGroup;
        let gameState = 'MENU';
        let score = 0, coins = 0;
        
        let roadSegments = [], obstacles = [], collectibles = [], powerups = [];
        const laneWidth = 2.5, segmentLength = 10, totalSegments = 25;
        let currentLane = 0, targetX = 0;
        let playerYVelocity = 0, isJumping = false, isFallingInHole = false;
        let lastSegmentWasHole = false;
        
        // Physics logic improvements
        const jumpForce = 0.25;
        const gravity = 0.011;
        let baseSpeed = 0.35;
        
        let tJump = 0, tCoin = 0, tSpeed = 0;
        let audioStarted = false, bgmSynth, softSynth;

        function initAudio() {
            if (audioStarted) return;
            audioStarted = true;
            Tone.start();
            bgmSynth = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 0.5 } }).toDestination();
            const notes = ['C4', 'E4', 'G4', 'B4', 'C5', 'G4', 'E4', 'D4'];
            let noteIdx = 0;
            new Tone.Loop(time => {
                if (gameState === 'PLAYING') { bgmSynth.triggerAttackRelease(notes[noteIdx], '8n', time); noteIdx = (noteIdx + 1) % notes.length; }
            }, '4n').start(0);
            Tone.Transport.bpm.value = 130;
            Tone.Transport.start();
            
            // Soft synth for powerups & coins
            softSynth = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 } }).toDestination();
        }

        function playSound(type) {
            if (!audioStarted) return;
            if (type === 'coin') softSynth.triggerAttackRelease('C6', '16n');
            if (type === 'jump') softSynth.triggerAttackRelease('G4', '8n');
            if (type === 'powerup') softSynth.triggerAttackRelease('E5', '8n');
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, -7);
            camera.lookAt(0, 1.5, 5);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.9);
            sun.position.set(20, 40, -10);
            sun.castShadow = true;
            scene.add(sun);

            createPlayer();
            buildWorld();
            setupControls();
            buildShop();
            updateMenuUI();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function createPlayer() {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();
            
            const skin = skinsData.find(s => s.id === equippedSkin) || skinsData[0];
            
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({ color: skin.head, roughness: 0.5 });
            const head = new THREE.Mesh(headGeo, headMat); head.position.y = 1.8; head.castShadow = true; playerGroup.add(head);
            
            if (skin.crown) {
                const crown = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.25, 0.85), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2 }));
                crown.position.y = 2.3; playerGroup.add(crown);
            }
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.0, 0.5), new THREE.MeshStandardMaterial({ color: skin.body }));
            torso.position.y = 1.0; torso.castShadow = true; playerGroup.add(torso);
            
            const armMat = new THREE.MeshStandardMaterial({ color: skin.arms });
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.4), armMat); lArm.position.set(-0.65, 1.0, 0); lArm.castShadow=true; playerGroup.add(lArm);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.4), armMat); rArm.position.set(0.65, 1.0, 0); rArm.castShadow=true; playerGroup.add(rArm);
            
            const legMat = new THREE.MeshStandardMaterial({ color: skin.legs });
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.4), legMat); lLeg.position.set(-0.22, 0.25, 0); lLeg.castShadow=true; playerGroup.add(lLeg);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.4), legMat); rLeg.position.set(0.22, 0.25, 0); rLeg.castShadow=true; playerGroup.add(rLeg);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);
        }

        function createRoadSegment(zPos, allowHole) {
            const group = new THREE.Group();
            group.position.z = zPos;
            let isHole = allowHole && !lastSegmentWasHole && Math.random() < 0.2;
            
            if (!isHole) {
                lastSegmentWasHole = false;
                const road = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, segmentLength), new THREE.MeshStandardMaterial({ color: 0x5c8a3f, roughness: 0.9 }));
                road.position.y = -0.25; road.receiveShadow = true; group.add(road);
                
                // Trees
                for(let side of [-1, 1]) {
                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2, 0.6), new THREE.MeshStandardMaterial({ color: 0x5c4033 })); trunk.position.y = 1;
                    const leaves = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 2), new THREE.MeshStandardMaterial({ color: 0x2e8b57 })); leaves.position.y = 3;
                    const tree = new THREE.Group(); tree.add(trunk); tree.add(leaves);
                    tree.position.set(side * 6, 0, (Math.random()-0.5)*6);
                    group.add(tree);
                }

                if (zPos > 20) {
                    const r = Math.random();
                    const lane = (Math.floor(Math.random()*3)-1) * laneWidth;
                    if (r < 0.3) {
                        const obs = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                        obs.position.set(lane, 0.75, 0); obs.castShadow = true; obs.userData = {type:'obstacle'};
                        group.add(obs); obstacles.push(obs);
                    } else if (r < 0.6) {
                        for(let c=0; c<3; c++) {
                            const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8 }));
                            coin.rotation.x = Math.PI/2; coin.position.set(lane, 0.8, c*1.5 - 1.5); coin.userData = {type:'coin'};
                            group.add(coin); collectibles.push(coin);
                        }
                    } else if (r < 0.7) {
                        const pType = Math.random() < 0.33 ? 'jump' : (Math.random() < 0.5 ? 'coin' : 'speed');
                        const pColor = pType === 'jump' ? 0x00ff00 : (pType === 'coin' ? 0xffff00 : 0x00ffff);
                        const pup = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), new THREE.MeshStandardMaterial({ color: pColor, emissive: pColor }));
                        pup.position.set(lane, 1.0, 0); pup.userData = {type:'powerup', pType: pType};
                        group.add(pup); powerups.push(pup);
                    }
                }
            } else {
                lastSegmentWasHole = true;
                group.userData = { isHole: true };
            }
            scene.add(group);
            roadSegments.push(group);
        }

        function buildWorld() {
            roadSegments.forEach(s=>scene.remove(s)); obstacles.forEach(s=>scene.remove(s)); collectibles.forEach(s=>scene.remove(s)); powerups.forEach(s=>scene.remove(s));
            roadSegments=[]; obstacles=[]; collectibles=[]; powerups=[]; lastSegmentWasHole=false;
            for(let i=0; i<totalSegments; i++) createRoadSegment(i*segmentLength, i>5);
        }

        function setupControls() {
            const handleMove = (dir) => { 
                if(gameState==='PLAYING') { 
                    currentLane = Math.max(-1, Math.min(1, currentLane + dir)); 
                    targetX = -currentLane * laneWidth; // FIXED INVERTED LOGIC HERE (-currentLane)
                } 
            };
            const handleJump = () => { if(gameState==='PLAYING' && !isJumping && !isFallingInHole) { isJumping = true; playerYVelocity = tJump>0 ? jumpForce*1.3 : jumpForce; playSound('jump'); }};
            
            window.addEventListener('keydown', e => {
                if(e.key==='ArrowLeft' || e.key.toLowerCase()==='a') handleMove(-1); // Left goes left visually
                if(e.key==='ArrowRight' || e.key.toLowerCase()==='d') handleMove(1); // Right goes right visually
                if(e.key==='ArrowUp' || e.key===' ' || e.key.toLowerCase()==='w') handleJump();
            });
            document.getElementById('btn-left').addEventListener('click', ()=>handleMove(-1));
            document.getElementById('btn-right').addEventListener('click', ()=>handleMove(1));
            document.getElementById('btn-jump').addEventListener('click', handleJump);
            
            let tsX=0, tsY=0;
            window.addEventListener('touchstart', e=>{ tsX=e.changedTouches[0].screenX; tsY=e.changedTouches[0].screenY; });
            window.addEventListener('touchend', e=>{
                let dx = e.changedTouches[0].screenX - tsX, dy = e.changedTouches[0].screenY - tsY;
                if(Math.abs(dx)>Math.abs(dy)) { if(dx>40) handleMove(1); else if(dx<-40) handleMove(-1); }
                else { if(dy<-40) handleJump(); }
            });
        }

        function startGame() {
            initAudio(); gameState = 'PLAYING'; score = 0; coins = 0; currentLane = 0; targetX = 0;
            isJumping = false; isFallingInHole = false; playerYVelocity = 0; tJump = 0; tCoin = 0; tSpeed = 0;
            document.querySelectorAll('.menu-screen').forEach(el=>el.style.display='none');
            document.getElementById('hud').style.display='flex';
            createPlayer(); buildWorld();
        }

        function handleGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud').style.display = 'none';
            document.querySelectorAll('.power-hud').forEach(el=>el.style.display='none');
            document.getElementById('final-score').innerText = `Score: ${Math.floor(score)}m`;
            if(score > highScore) { highScore = score; localStorage.setItem('vw_highscore', highScore); }
            totalCoins += coins; localStorage.setItem('vw_total_coins', totalCoins);
            
            const technoText = document.getElementById('techno-text');
            if(equippedSkin === 'default') {
                technoText.style.display = 'block';
                if('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance("Not even close baby, Technoblade never dies!");
                    u.pitch=1.1; u.rate=1.0; window.speechSynthesis.speak(u);
                }
            } else { technoText.style.display = 'none'; }
            document.getElementById('gameover-menu').style.display='flex';
        }

        function goHome() { gameState='MENU'; document.getElementById('gameover-menu').style.display='none'; updateMenuUI(); document.getElementById('main-menu').style.display='flex'; }
        
        function updateMenuUI() { document.getElementById('menu-highscore').innerText = `🏆 High Score: ${Math.floor(highScore)}m`; document.getElementById('menu-totalcoins').innerText = `🪙 Coins: ${totalCoins}`; }

        function buildShop() {
            const container = document.getElementById('shop-grid-container'); container.innerHTML = '';
            skinsData.forEach(skin => {
                const card = document.createElement('div'); card.className = 'shop-card';
                // Using dicebear pixels for placeholder avatars based on name
                const avatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${skin.name.replace(/\s/g,'')}`;
                let btnHtml = '';
                if (equippedSkin === skin.id) btnHtml = `<button class="btn interactive" style="background:#28a745">EQUIPPED</button>`;
                else if (unlockedSkins.includes(skin.id)) btnHtml = `<button class="btn interactive" style="background:#007bff" onclick="equipSkin('${skin.id}')">EQUIP</button>`;
                else btnHtml = `<button class="btn interactive" style="background:#ffc107; color:black;" onclick="buySkin('${skin.id}', ${skin.cost})">BUY (${skin.cost}🪙)</button>`;
                
                card.innerHTML = `<img src="${avatarUrl}" alt="${skin.name}"><h3>${skin.name}</h3>${btnHtml}`;
                container.appendChild(card);
            });
            document.getElementById('shop-coins').innerText = totalCoins;
        }

        function openShop() { document.getElementById('main-menu').style.display='none'; buildShop(); document.getElementById('shop-menu').style.display='flex'; }
        function closeShop() { document.getElementById('shop-menu').style.display='none'; updateMenuUI(); document.getElementById('main-menu').style.display='flex'; }
        
        window.equipSkin = (id) => { equippedSkin = id; localStorage.setItem('vw_equipped_skin', id); buildShop(); createPlayer(); };
        window.buySkin = (id, cost) => {
            if(totalCoins >= cost) {
                totalCoins -= cost; localStorage.setItem('vw_total_coins', totalCoins);
                unlockedSkins.push(id); localStorage.setItem('vw_unlocked_skins', JSON.stringify(unlockedSkins));
                equipSkin(id);
            } else alert('Not enough coins!');
        };

        function updateHUDTimers() {
            const upd = (id, t) => { const el=document.getElementById(`hud-${id}`); if(t>0){ el.style.display='block'; document.getElementById(`val-${id}`).innerText=Math.ceil(t); } else el.style.display='none'; }
            upd('jump', tJump); upd('coin', tCoin); upd('speed', tSpeed);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameState === 'PLAYING') {
                let currentSpeed = tSpeed > 0 ? baseSpeed * 1.5 : baseSpeed;
                score += currentSpeed;
                document.getElementById('score-val').innerText = Math.floor(score);
                document.getElementById('coins-val').innerText = coins;
                
                if(tJump>0) tJump-=0.016; if(tCoin>0) tCoin-=0.016; if(tSpeed>0) tSpeed-=0.016;
                updateHUDTimers();

                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.15;
                if (isJumping || isFallingInHole) {
                    playerGroup.position.y += playerYVelocity; playerYVelocity -= gravity;
                    if (!isFallingInHole && playerGroup.position.y <= 0) { playerGroup.position.y = 0; isJumping = false; playerYVelocity = 0; }
                }

                roadSegments.forEach(s => s.position.z -= currentSpeed);
                if (roadSegments[0].position.z < -segmentLength) {
                    scene.remove(roadSegments.shift());
                    createRoadSegment(roadSegments[roadSegments.length - 1].position.z + segmentLength, true);
                }

                if (!isJumping && !isFallingInHole) {
                    let seg = roadSegments.find(s => Math.abs(s.position.z - playerGroup.position.z) < segmentLength/2);
                    if (seg && seg.userData.isHole) { isFallingInHole = true; playerYVelocity = -0.05; }
                }
                if (playerGroup.position.y < -10) handleGameOver();

                obstacles.forEach(o => {
                    let p = new THREE.Vector3(); o.getWorldPosition(p);
                    if (Math.abs(p.z-playerGroup.position.z)<0.8 && Math.abs(p.x-playerGroup.position.x)<0.8 && playerGroup.position.y<1.2) handleGameOver();
                });
                collectibles.forEach(c => {
                    if (c.visible) {
                        let p = new THREE.Vector3(); c.getWorldPosition(p); c.rotation.z+=0.05;
                        if (Math.abs(p.z-playerGroup.position.z)<1.0 && Math.abs(p.x-playerGroup.position.x)<1.0 && playerGroup.position.y<2.0) {
                            c.visible=false; coins += (tCoin>0?2:1); playSound('coin');
                        }
                    }
                });
                powerups.forEach(p => {
                    if (p.visible) {
                        let pos = new THREE.Vector3(); p.getWorldPosition(pos); p.rotation.y+=0.08;
                        if (Math.abs(pos.z-playerGroup.position.z)<1.0 && Math.abs(pos.x-playerGroup.position.x)<1.0) {
                            p.visible=false; playSound('powerup');
                            if(p.userData.pType==='jump') tJump=5; else if(p.userData.pType==='coin') tCoin=5; else tSpeed=5;
                        }
                    }
                });
            }
            renderer.render(scene, camera);
        }
        window.onload = initThree;
    </script>
</body>
</html>
